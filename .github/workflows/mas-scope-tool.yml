name: mas-scope-tool
on:
  push:
    branches: [tools-mas-scope]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pyinstaller
      - run: pyinstaller --onefile --windowed --name MAS_Scope_Tool mas_scope_tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: MAS_Scope_Tool
          path: dist/MAS_Scope_Tool.exe
      - name: Publish to release mas-scope-tool
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mas-scope-tool >/dev/null 2>&1 || gh release create mas-scope-tool --target tools-mas-scope --title "MAS Scope Tool" --notes "Windows exe of the MAS scope converter (branch tools-mas-scope)." --prerelease
          gh release upload mas-scope-tool dist/MAS_Scope_Tool.exe --clobber
